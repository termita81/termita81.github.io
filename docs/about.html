<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="color-scheme" content="light dark" />
		<title>About - My Blog</title>
		<link rel="stylesheet" href="/styles/main.css?v=20260827-0826" />
		<link rel="manifest" href="/manifest.json" />
		<link rel="apple-touch-icon" href="/icons/icon-192.png" />
		<meta name="theme-color" content="#0066cc" />
		<script>
			// Apply theme immediately to prevent flash
			;(function () {
				const savedTheme = localStorage.getItem('site-theme')

				// Handle the three modes: 'light', 'dark', or 'system'
				if (savedTheme === 'light') {
					document.documentElement.classList.add('light-theme')
				} else if (savedTheme === 'dark') {
					document.documentElement.classList.add('dark-theme')
				}
				// If savedTheme is 'system' or null, don't add any class
				// CSS will use the prefers-color-scheme media query
			})()
		</script>
	</head>

	<body>
		<header class="site-header">
			<nav class="site-nav">
				<a href="/" class="nav-link">Home</a>
				<!-- <a href="/apps.html" class="nav-link">Apps</a> -->
				<a href="/about.html" class="nav-link">About</a>
				<button
					id="theme-toggle"
					class="theme-toggle"
					aria-label="Toggle theme"
				>
					<span class="theme-icon">◐</span>
				</button>
			</nav>
		</header>

		<main class="site-main"><div class="about">
	<h1>About</h1>
	<p>
		Welcome to my blog! This is where I share my thoughts, ideas, and projects.
	</p>
	<p>
		Feel free to browse through the articles and reach out if you'd like to
		connect.
	</p>

	<h2>Get in touch</h2>
	<form id="contact-form" class="contact-form" action="https://api.web3forms.com/submit" method="POST">
		<input type="hidden" name="access_key" value="e074accc-182c-4b25-86ca-519fd862706e" />
		<input type="hidden" name="subject" value="New message from the blog contact form" />
		<input type="checkbox" name="botcheck" class="botcheck-field" tabindex="-1" autocomplete="off" />

		<label for="contact-name">Name</label>
		<input type="text" id="contact-name" name="name" required />

		<label for="contact-email">Email</label>
		<input type="email" id="contact-email" name="email" required />

		<label for="contact-message">Message</label>
		<textarea id="contact-message" name="message" rows="5" required></textarea>

		<button type="submit">Send</button>
		<p id="contact-form-status" class="contact-form-status" role="status"></p>
	</form>
</div>

<script src="/scripts/contact.js?v=20260827-0826"></script>
</main>

		<script src="/scripts/theme.js?v=20260827-0826"></script>
		<script src="/installServiceWorker.js"></script>

		<footer class="site-footer">

		</footer>
	</body>
</html>
