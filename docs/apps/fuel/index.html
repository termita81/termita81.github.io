<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fuel Tracker</title>
  <link rel="stylesheet" href="fuel.css" />
</head>
<body>
  <div id="app">
    <!-- Main Content Area -->
    <main id="main-content">
      <!-- Log Section -->
      <section id="log-section" class="section active">
        <h1>Log Fill-up</h1>
        <form id="fuel-form">
          <label for="fuel-date">Date:<br><input type="date" id="fuel-date" required></label>
          <label for="fuel-odometer">Odometer (km):<br><input type="number" id="fuel-odometer" min="0" required></label>
          <label for="fuel-amount">Fuel Amount (L):<br><input type="number" id="fuel-amount" step="0.01" min="0" required></label>
          <label for="fuel-price">Total Price ($):<br><input type="number" id="fuel-price" step="0.01" min="0" required></label>
          <label for="fuel-station">Station:<br><input type="text" id="fuel-station" required></label>
          <label for="fuel-location">Location:<br><input type="text" id="fuel-location"></label>
          <label for="fuel-fill-type">Fill Type:<br><select id="fuel-fill-type"><option value="regular">Regular</option><option value="premium">Premium</option><option value="diesel">Diesel</option><option value="electric">Electric</option></select></label>
          <div class="form-actions" style="margin-top:1rem;display:flex;gap:0.5rem;"><button type="submit">Save</button><button type="button" id="cancel-btn">Cancel</button></div>
        </form>
      </section>

      <!-- History Section -->
      <section id="history-section" class="section">
        <h1>History</h1>
        <div id="summary-stats" class="summary-cards"></div>
        <table id="history-table">
          <thead>
            <tr>
              <th>Date</th>
              <th>Odometer (km)</th>
              <th>Fuel (L)</th>
              <th>Price ($)</th>
              <th>Station</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </section>

      <!-- Settings Section -->
      <section id="settings-section" class="section">
        <h1>Settings</h1>
        <p>Settings options will be added here.</p>
        <div class="settings-actions">
          <button id="export-btn">Export JSON</button>
          <button id="import-btn">Import JSON</button>
          <button id="clear-btn">Clear Data</button>
          <input type="file" id="import-file" accept="application/json" style="display:none;">
        </div>
      </section>
    </main>

    <!-- Bottom Tab Navigation -->
    <nav id="tab-nav">
      <button class="tab active" data-tab="log">
        <span>Log</span>
      </button>
      <button class="tab" data-tab="history">
        <span>History</span>
      </button>
      <button class="tab" data-tab="settings">
        <span>Settings</span>
      </button>
    </nav>
  </div>

  <script src="fuel.js"></script>
</body>
</html>
