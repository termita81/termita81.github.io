<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fuel Tracker</title>
  <link rel="stylesheet" href="fuel.css" />
  <!-- PWA meta tags -->
  <meta name="theme-color" content="#2563eb" />
  <link rel="manifest" href="/manifest.json" />
</head>
<body>
  <div id="app">
    <!-- Message / Feedback area -->
    <div id="message" role="status" aria-live="polite"></div>
    <!-- Main Content Area -->
    <main id="main-content">
      <!-- History Section -->
      <section id="history-section" class="section active">
        <div class="section-header">
          <h1>History</h1>
          <button id="log-btn" type="button">Log Fill-up</button>
        </div>
        <div id="summary-stats" class="summary-cards"></div>
        <table id="history-table">
          <thead>
            <tr>
              <th>Date</th>
              <th>Odometer (km)</th>
              <th>Fuel (L)</th>
              <th>Price ($)</th>
              <th>Station</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </section>

      <!-- Settings Section -->
      <section id="settings-section" class="section">
        <h1>Settings</h1>
        <p>Settings options will be added here.</p>
        <div class="settings-actions">
          <button id="export-btn">Export JSON</button>
          <button id="import-btn">Import JSON</button>
          <button id="clear-btn">Clear Data</button>
          <input type="file" id="import-file" accept="application/json" style="display:none;">
        </div>
      </section>
    </main>

    <!-- Bottom Tab Navigation -->
    <nav id="tab-nav">
      <button class="tab active" data-tab="history">
        <span>History</span>
      </button>
      <button class="tab" data-tab="settings">
        <span>Settings</span>
      </button>
    </nav>

    <!-- Log Entry Modal -->
    <div id="log-modal" class="modal-overlay" hidden>
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="log-modal-title">
        <h2 id="log-modal-title">Log Fill-up</h2>
        <form id="fuel-form">
          <label for="fuel-date">Date:<br><input type="date" id="fuel-date" required></label>
          <label for="fuel-odometer">Odometer (km):<br><input type="number" id="fuel-odometer" min="0" required></label>
          <label for="fuel-amount">Fuel Amount (L):<br><input type="number" id="fuel-amount" step="0.01" min="0" required></label>
          <label for="fuel-price">Total Price ($):<br><input type="number" id="fuel-price" step="0.01" min="0" required></label>
          <label for="fuel-station">Station:<br><input type="text" id="fuel-station" required></label>
          <label for="fuel-location">Location:<br><input type="text" id="fuel-location"></label>
          <label for="fuel-fill-type">Fill Type:<br><select id="fuel-fill-type"><option value="full">Full</option><option value="partial">Partial</option></select></label>
          <div class="form-actions"><button type="submit">Save</button><button type="button" id="cancel-btn">Cancel</button></div>
        </form>
      </div>
    </div>
  </div>

  <script src="fuel.js"></script>
</body>
</html>
